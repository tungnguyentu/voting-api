# Host networking so containers use the host LAN/VPN routing to Redis.
# Linux only (Docker Engine). Docker Desktop Windows/Mac: host mode is limited.
#
# Usage (instead of docker-compose.yml):
#   docker compose -f docker-compose.host.yml up -d --build
#
# API: http://localhost:8000  (binds on host network)

services:
  api:
    build:
      context: .
    container_name: voting-api
    network_mode: host
    environment:
      SOURCE_REDIS_URL: ${SOURCE_REDIS_URL:-redis://10.192.202.210:6379/0}
      HISTORY_REDIS_URL: ${HISTORY_REDIS_URL:-redis://10.192.202.210:6379/1}
      SOURCE_VOTING_RESULT_KEY: ${SOURCE_VOTING_RESULT_KEY:-voting_result}
      HISTORY_VOTE_KEY: ${HISTORY_VOTE_KEY:-vote_history}
      HISTORY_ATTENDANCE_KEY: ${HISTORY_ATTENDANCE_KEY:-attendance_history}
      HISTORY_DISCUSS_KEY: ${HISTORY_DISCUSS_KEY:-discuss_history}
      ACTIVE_VOTE_KEY: ${ACTIVE_VOTE_KEY:-vote_history_active}
      ACTIVE_ATTENDANCE_KEY: ${ACTIVE_ATTENDANCE_KEY:-attendance_history_active}
      ACTIVE_DISCUSS_KEY: ${ACTIVE_DISCUSS_KEY:-discuss_history_active}
      DELEGATE_DIRECTORY_KEY: ${DELEGATE_DIRECTORY_KEY:-delegate_directory}
      MONITOR_CHANNEL: ${MONITOR_CHANNEL:-voting_monitor_channel_6}
    restart: always

  listener:
    build:
      context: .
    container_name: voting-history-listener
    network_mode: host
    command: ["python", "-m", "app.vote_history_listener"]
    environment:
      SOURCE_REDIS_URL: ${SOURCE_REDIS_URL:-redis://10.192.202.210:6379/0}
      HISTORY_REDIS_URL: ${HISTORY_REDIS_URL:-redis://10.192.202.210:6379/1}
      SOURCE_VOTING_RESULT_KEY: ${SOURCE_VOTING_RESULT_KEY:-voting_result}
      HISTORY_VOTE_KEY: ${HISTORY_VOTE_KEY:-vote_history}
      HISTORY_ATTENDANCE_KEY: ${HISTORY_ATTENDANCE_KEY:-attendance_history}
      HISTORY_DISCUSS_KEY: ${HISTORY_DISCUSS_KEY:-discuss_history}
      ACTIVE_VOTE_KEY: ${ACTIVE_VOTE_KEY:-vote_history_active}
      ACTIVE_ATTENDANCE_KEY: ${ACTIVE_ATTENDANCE_KEY:-attendance_history_active}
      ACTIVE_DISCUSS_KEY: ${ACTIVE_DISCUSS_KEY:-discuss_history_active}
      DELEGATE_DIRECTORY_KEY: ${DELEGATE_DIRECTORY_KEY:-delegate_directory}
      MONITOR_CHANNEL: ${MONITOR_CHANNEL:-voting_monitor_channel_6}
    restart: always
