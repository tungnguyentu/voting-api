# Docker Desktop Windows + Redis in WSL2:
#   1. Redis in WSL: bind 0.0.0.0, port 6379
#   2. Copy .env.example -> .env (uses host.docker.internal)
#   3. docker compose up -d --build
#
# Linux server + Redis on LAN — host network:
#   docker compose -f docker-compose.host.yml up -d --build

services:
  api:
    build:
      context: .
    container_name: voting-api
    ports:
      - "8000:8000"
    extra_hosts:
      # Docker Desktop: reach Windows host / WSL-forwarded localhost ports
      - "host.docker.internal:host-gateway"
    environment:
      # Default for Docker Desktop + Redis in WSL (override in .env for LAN Redis)
      SOURCE_REDIS_URL: ${SOURCE_REDIS_URL:-redis://host.docker.internal:6379/0}
      HISTORY_REDIS_URL: ${HISTORY_REDIS_URL:-redis://host.docker.internal:6379/1}
      SOURCE_VOTING_RESULT_KEY: ${SOURCE_VOTING_RESULT_KEY:-voting_result}
      HISTORY_VOTE_KEY: ${HISTORY_VOTE_KEY:-vote_history}
      HISTORY_ATTENDANCE_KEY: ${HISTORY_ATTENDANCE_KEY:-attendance_history}
      HISTORY_DISCUSS_KEY: ${HISTORY_DISCUSS_KEY:-discuss_history}
      ACTIVE_VOTE_KEY: ${ACTIVE_VOTE_KEY:-vote_history_active}
      ACTIVE_ATTENDANCE_KEY: ${ACTIVE_ATTENDANCE_KEY:-attendance_history_active}
      ACTIVE_DISCUSS_KEY: ${ACTIVE_DISCUSS_KEY:-discuss_history_active}
      DELEGATE_DIRECTORY_KEY: ${DELEGATE_DIRECTORY_KEY:-delegate_directory}
      MONITOR_CHANNEL: ${MONITOR_CHANNEL:-voting_monitor_channel_6}
    # Restart when Docker Desktop / daemon starts (if stack was brought up once)
    restart: always

  listener:
    build:
      context: .
    container_name: voting-history-listener
    command: ["python", "-m", "app.vote_history_listener"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SOURCE_REDIS_URL: ${SOURCE_REDIS_URL:-redis://host.docker.internal:6379/0}
      HISTORY_REDIS_URL: ${HISTORY_REDIS_URL:-redis://host.docker.internal:6379/1}
      SOURCE_VOTING_RESULT_KEY: ${SOURCE_VOTING_RESULT_KEY:-voting_result}
      HISTORY_VOTE_KEY: ${HISTORY_VOTE_KEY:-vote_history}
      HISTORY_ATTENDANCE_KEY: ${HISTORY_ATTENDANCE_KEY:-attendance_history}
      HISTORY_DISCUSS_KEY: ${HISTORY_DISCUSS_KEY:-discuss_history}
      ACTIVE_VOTE_KEY: ${ACTIVE_VOTE_KEY:-vote_history_active}
      ACTIVE_ATTENDANCE_KEY: ${ACTIVE_ATTENDANCE_KEY:-attendance_history_active}
      ACTIVE_DISCUSS_KEY: ${ACTIVE_DISCUSS_KEY:-discuss_history_active}
      DELEGATE_DIRECTORY_KEY: ${DELEGATE_DIRECTORY_KEY:-delegate_directory}
      MONITOR_CHANNEL: ${MONITOR_CHANNEL:-voting_monitor_channel_6}
    restart: always
